<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title description">
  <title id="title">Out-of-order execution in the Rust CPU simulator</title>
  <desc id="description">Software implementation dataflow for the configurable out-of-order model. Instructions move through a fetch buffer, decode and rename, shared reservation stations, and latency-based execution. Decode allocates reorder-buffer entries. Completed scalar values and flags wake dependent reservation stations, while the reorder buffer retires register results in program order. Branch outcomes update a predictor; a misprediction flushes younger work and redirects fetch. An optional tag-only cache model adds latency at issue. Data reads and writes happen during instruction execution. With N reservation stations, fetch, dispatch and retirement have widths of min(2,N) instructions per cycle; the reorder buffer has 4N entries.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-blue-start" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 5 L 10 10 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#B45309"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1440" height="1000" fill="#F8FAFC"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="36" fill="#0F766E" font-size="14" font-weight="700" letter-spacing="1.7">RUST CPU SIMULATOR</text>
    <text x="64" y="76" fill="#0F172A" font-size="34" font-weight="700">Out-of-order execution</text>
    <text x="64" y="109" fill="#475569" font-size="18">Operand readiness permits out-of-order execution; register results retire in program order.</text>

    <!-- Speculation control is kept above the instruction flow. -->
    <path d="M 1318 340 V 155 H 112 V 328" fill="none" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
    <text x="422" y="140" fill="#B45309" font-size="17">Mispredict: flush younger work and redirect fetch</text>
    <path d="M 1235 340 V 229 H 1122" fill="none" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
    <text x="1138" y="211" fill="#B45309" font-size="17">Outcome</text>
    <path d="M 818 229 H 235 V 328" fill="none" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
    <text x="430" y="211" fill="#B45309" font-size="17">Predict next PC</text>
    <rect x="830" y="186" width="280" height="86" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="854" y="221" fill="#0F172A" font-size="22" font-weight="700">Branch predictor</text>
    <text x="854" y="249" fill="#475569" font-size="17">Static · 1-bit · 2-bit</text>

    <text x="411" y="317" fill="#475569" font-size="14" font-weight="700" letter-spacing="1.4">INSTRUCTION FLOW</text>

    <!-- Main instruction flow. -->
    <g fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)">
      <path d="M 346 411 H 399"/>
      <path d="M 693 411 H 746"/>
      <path d="M 1040 411 H 1093"/>
    </g>
    <g fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5">
      <rect x="64" y="340" width="270" height="142" rx="14"/>
      <rect x="411" y="340" width="270" height="142" rx="14"/>
      <rect x="758" y="340" width="270" height="142" rx="14"/>
      <rect x="1105" y="340" width="270" height="142" rx="14"/>
    </g>
    <g fill="#0F172A" font-size="22" font-weight="700">
      <text x="88" y="383">Fetch buffer</text>
      <text x="435" y="383">Decode &amp; rename</text>
      <text x="782" y="383">Reservation stations</text>
      <text x="1129" y="383">Execute / complete</text>
    </g>
    <g fill="#475569" font-size="17">
      <text x="88" y="414">Program instructions</text>
      <text x="88" y="441">Speculative next PC</text>
      <text x="435" y="414">Read values or ROB tags</text>
      <text x="435" y="441">Allocate ROB + RS</text>
      <text x="782" y="414">Wait for operand readiness</text>
      <text x="782" y="441">Issue ready instructions</text>
      <text x="1129" y="414">Instruction-specific latency</text>
      <text x="1129" y="441">Produce results and effects</text>
    </g>

    <!-- Forward only the scalar values and flags modeled by the CDB path. -->
    <path d="M 1175 482 V 540 H 890 V 494" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
    <text x="935" y="523" fill="#0F766E" font-size="17">GP values + flags</text>

    <!-- Rename allocation and reads of committed state occupy separate lanes. -->
    <path d="M 546 482 V 574 H 930 V 613" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
    <text x="638" y="558" fill="#2563EB" font-size="17">Allocate ROB entry</text>
    <path d="M 198 625 V 574 H 385 V 450 H 399" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-slate)"/>
    <text x="103" y="558" fill="#475569" font-size="17">Read committed values</text>

    <!-- Completion fills the ROB; only register/flag retirement goes through it. -->
    <path d="M 1285 482 V 685 H 1112" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
    <text x="1116" y="667" fill="#2563EB" font-size="17">Completed results</text>
    <g fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)">
      <path d="M 746 685 H 693"/>
      <path d="M 399 685 H 346"/>
    </g>
    <text x="411" y="606" fill="#475569" font-size="14" font-weight="700" letter-spacing="1.4">IN-ORDER REGISTER RETIREMENT</text>
    <g fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5">
      <rect x="64" y="625" width="270" height="120" rx="14"/>
      <rect x="411" y="625" width="270" height="120" rx="14"/>
      <rect x="758" y="625" width="342" height="120" rx="14"/>
    </g>
    <g fill="#0F172A" font-size="22" font-weight="700">
      <text x="88" y="663">Architectural state</text>
      <text x="435" y="663">Retire</text>
      <text x="782" y="663">Reorder buffer</text>
    </g>
    <g fill="#475569" font-size="17">
      <text x="88" y="694">GP + vector registers</text>
      <text x="88" y="721">N / Z / C / V flags</text>
      <text x="435" y="694">Commit oldest ready entries</text>
      <text x="435" y="721">Update architectural state</text>
      <text x="782" y="694">Hold completed register results</text>
      <text x="782" y="721">Retire in program order</text>
    </g>

    <!-- Memory effects bypass the ROB in this implementation. -->
    <path d="M 1345 494 V 790" fill="none" stroke="#2563EB" stroke-width="2.5" marker-start="url(#arrow-blue-start)" marker-end="url(#arrow-blue)"/>
    <text x="1168" y="776" fill="#2563EB" font-size="17">Memory access</text>
    <g fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5">
      <rect x="758" y="802" width="342" height="126" rx="14"/>
      <rect x="1105" y="802" width="270" height="126" rx="14"/>
    </g>
    <g fill="#0F172A" font-size="22" font-weight="700">
      <text x="782" y="838">Optional cache timing</text>
      <text x="1129" y="838">Data memory</text>
    </g>
    <g fill="#475569" font-size="17">
      <text x="782" y="865">Tag-only checks at issue</text>
      <text x="782" y="889">256 × 4 B · direct-mapped</text>
      <text x="782" y="913">+8 cycles per miss</text>
      <text x="1129" y="865">64 KiB · byte-addressable</text>
      <text x="1129" y="889">Stores update memory</text>
      <text x="1129" y="913">during execution.</text>
    </g>

    <text x="64" y="824" fill="#475569" font-size="14" font-weight="700" letter-spacing="1.4">MODEL PARAMETERS</text>
    <g fill="#0F172A" font-size="18">
      <text x="64" y="853">N = reservation stations (--units)</text>
      <text x="64" y="880">Fetch, dispatch, retire: min(2, N) · ROB: 4N entries</text>
    </g>
    <text x="64" y="915" fill="#475569" font-size="17">Software dataflow for the configurable out-of-order model.</text>

    <line x1="64" y1="951" x2="1375" y2="951" stroke="#CBD5E1" stroke-width="1"/>
    <g fill="none" stroke-width="3">
      <line x1="64" y1="977" x2="96" y2="977" stroke="#2563EB"/>
      <line x1="382" y1="977" x2="414" y2="977" stroke="#0F766E"/>
      <line x1="676" y1="977" x2="708" y2="977" stroke="#B45309"/>
      <line x1="969" y1="977" x2="1001" y2="977" stroke="#64748B"/>
    </g>
    <g fill="#475569" font-size="16">
      <text x="108" y="983">Instructions / results</text>
      <text x="426" y="983">Operand forwarding</text>
      <text x="720" y="983">Speculation control</text>
      <text x="1013" y="983">Committed values</text>
    </g>
  </g>
</svg>
