<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="title desc">
  <title id="title">One instruction set, three execution models</title>
  <desc id="desc">A text assembly program is parsed by a two-pass assembler into decoded instructions and initial data memory. A run selects the scalar, pipeline, or out-of-order execution model. All models report performance counters. The diagram presents the software simulator and its execution models.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#64748B"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0F172A; }
      .kicker { font-size: 14px; font-weight: 700; letter-spacing: 2px; fill: #475569; }
      .heading { font-size: 34px; font-weight: 700; }
      .label { font-size: 23px; font-weight: 700; }
      .body { font-size: 18px; fill: #475569; }
      .detail { font-size: 17px; fill: #475569; }
      .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 16px; fill: #475569; }
      .edge { fill: none; stroke: #64748B; stroke-width: 2; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1440" height="930" fill="#F8FAFC"/>
  <text x="64" y="57" class="kicker">SYSTEM OVERVIEW</text>
  <text x="64" y="104" class="heading">One instruction set. Three execution models.</text>
  <text x="64" y="139" class="body">The same assembly workloads, with different scheduling and timing rules.</text>

  <!-- Input and shared representation -->
  <rect x="64" y="184" width="264" height="144" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="88" y="224" class="label">Assembly program</text>
  <text x="88" y="257" class="body">Instructions + initial data</text>
  <text x="88" y="300" class="code">src/programs/*.asm</text>

  <path d="M328 256 H374" class="edge" marker-end="url(#arrow)"/>
  <rect x="376" y="184" width="316" height="144" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="400" y="224" class="label">Two-pass assembler</text>
  <text x="400" y="257" class="body">Resolve labels and operands</text>
  <text x="400" y="300" class="code">assembler.rs</text>

  <path d="M692 256 H738" class="edge" marker-end="url(#arrow)"/>
  <rect x="740" y="184" width="636" height="144" rx="12" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="764" y="224" class="label">Decoded program + initial memory</text>
  <text x="764" y="257" class="body">Instruction objects · 64 KiB data memory</text>
  <text x="764" y="300" class="detail">Shared ISA definitions and instruction execution semantics</text>

  <!-- A run chooses one model -->
  <text x="64" y="370" class="kicker">SELECT ONE MODEL</text>
  <path d="M1058 328 V366 M272 366 H1168" class="edge"/>
  <path d="M272 366 V406" class="edge" marker-end="url(#arrow)"/>
  <path d="M720 366 V406" class="edge" marker-end="url(#arrow)"/>
  <path d="M1168 366 V406" class="edge" marker-end="url(#arrow)"/>
  <circle cx="1058" cy="366" r="3.5" fill="#64748B"/>

  <!-- Scalar -->
  <rect x="64" y="408" width="416" height="250" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <path d="M80 408 H464" stroke="#64748B" stroke-width="4"/>
  <text x="88" y="453" class="label">Scalar</text>
  <text x="88" y="483" class="body">Sequential baseline</text>
  <line x1="88" y1="503" x2="456" y2="503" stroke="#E2E8F0"/>
  <text x="88" y="539" class="body">One instruction at a time</text>
  <text x="88" y="569" class="body">Fetch → decode → execute</text>
  <text x="88" y="599" class="body">Explicit instruction latencies</text>
  <text x="88" y="634" class="code">sim_scalar.rs</text>

  <!-- Pipeline -->
  <rect x="512" y="408" width="416" height="250" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <path d="M528 408 H912" stroke="#2563EB" stroke-width="4"/>
  <text x="536" y="453" class="label">Pipeline</text>
  <text x="536" y="483" class="body">Overlapped execution</text>
  <line x1="536" y1="503" x2="904" y2="503" stroke="#E2E8F0"/>
  <text x="536" y="539" class="body">Single issue · N execution slots</text>
  <text x="536" y="569" class="body">Data and flag dependency checks</text>
  <text x="536" y="599" class="body">Optional operand forwarding</text>
  <text x="536" y="634" class="code">sim_pipeline.rs</text>

  <!-- OoO -->
  <rect x="960" y="408" width="416" height="250" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <path d="M976 408 H1360" stroke="#0F766E" stroke-width="4"/>
  <text x="984" y="453" class="label">Out of order</text>
  <text x="984" y="483" class="body">Dependency-driven scheduling</text>
  <line x1="984" y1="503" x2="1352" y2="503" stroke="#E2E8F0"/>
  <text x="984" y="539" class="body">Tomasulo-style reservation stations</text>
  <text x="984" y="569" class="body">ROB tags for register renaming</text>
  <text x="984" y="599" class="body">In-order register retirement</text>
  <text x="984" y="634" class="code">sim_ooo.rs</text>

  <!-- Common instrumentation -->
  <path d="M272 658 V700 H1168 V658 M720 658 V700" class="edge"/>
  <path d="M720 700 V734" class="edge" marker-end="url(#arrow)"/>
  <circle cx="720" cy="700" r="3.5" fill="#64748B"/>
  <rect x="64" y="736" width="1312" height="124" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="88" y="779" class="label">Performance counters</text>
  <text x="88" y="814" class="body">Cycles · instructions · IPC · branch prediction · stalls · cache hits / misses when enabled</text>
  <text x="88" y="840" class="detail">Compare observations from the simulator's timing model.</text>

  <text x="64" y="899" class="detail">Thumb-inspired ISA · explicit timing model · text assembly input</text>
  <text x="1376" y="899" text-anchor="end" class="detail">01 / OVERVIEW</text>
</svg>
